[package]
name = "powermanager-tauri-lab"
# Internal crate version. The app version comes from tauri.conf.json → package.json.
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
