name: Windows release

on:
  pull_request:
    branches: [main]
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/release/') && (github.event_name != 'create' || github.event.ref_type == 'branch'))
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install project dependencies
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision Windows build tools
        run: |
          $dev = Join-Path $env:RUNNER_TEMP 'w64devkit-x64-2.5.0.7z.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.5.0/w64devkit-x64-2.5.0.7z.exe' -OutFile $dev
          if ((Get-FileHash $dev).Hash -ne '7AC8F55BEFB93720F048F2C788704543FBC632C0164A8239ECBDEFC9559481C5') { throw 'Unexpected w64devkit SHA-256' }
          & 'C:\Program Files\7-Zip\7z.exe' x -y "-o$env:RUNNER_TEMP" $dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'w64devkit') -Filter g++.exe -Recurse | Select-Object -First 1
          if (!$compiler) { throw 'g++.exe not found' }
          "POWER_MANAGER_TOOLCHAIN_BIN=$($compiler.DirectoryName)" >> $env:GITHUB_ENV
      - name: Build WebView2 installer
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./installer/webview2/package-windows.ps1
      - name: Verify silent install and uninstall
        run: |
          $v = node -p "require('./package.json').version"
          & ./installer/webview2/test-install.ps1 -SetupPath "out/$v/PowerManager-Setup-$v.exe"
      - name: Verify portable ZIP launch and collector
        run: |
          $v = node -p "require('./package.json').version"
          & ./installer/webview2/test-portable.ps1 -ZipPath "out/$v/PowerManager-$v-win-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          if-no-files-found: error
          path: out/*/
  publish:
    if: github.ref == 'refs/heads/release/0.2.2' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: artifact
      - name: Create v0.2.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = node -p "require('./package.json').version"
          if ($v -ne '0.2.2') { throw 'Unexpected release version' }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq .commit.sha
          if ($LASTEXITCODE -ne 0 -or $main -ne $env:GITHUB_SHA) { throw 'Release commit must be the current main head' }
          $files = @(Get-ChildItem artifact -Recurse -File | Where-Object Name -in "PowerManager-Setup-$v.exe", "PowerManager-$v-win-x64.zip", "SHA256SUMS.txt")
          if ($files.Count -ne 3) { throw 'Missing or ambiguous release assets' }
          $assetPaths = @($files.FullName)
          gh release create "v$v" @assetPaths --target $env:GITHUB_SHA --title "PowerManager $v" --notes-file ".github/release-notes/$v.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
